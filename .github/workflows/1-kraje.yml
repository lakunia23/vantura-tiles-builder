name: "1. Zbuduj kafle (cały świat lub wybrane kraje)"

on:
  workflow_dispatch:
    inputs:
      kraje:
        description: "world = cały świat (najpierw Polska i sąsiedzi) albo kraje po przecinku, np. poland"
        required: true
        default: "world"
      partia:
        description: "Numer partii (zostaw 1 - kolejne uruchomią się same)"
        required: true
        default: "1"
      runda:
        description: "Runda (zostaw 1; rundy 2 i 3 uzupełniają kafle, które się nie udały)"
        required: true
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: budowa-kafli
  cancel-in-progress: false

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      bloki: ${{ steps.lista.outputs.bloki }}
      partie: ${{ steps.lista.outputs.partie }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Biblioteki
        run: pip install osmium shapely
      - name: Lista bloków kafli
        id: lista
        working-directory: builder
        env:
          DRY_RUN: "1"
          PIN_COUNTRIES: ${{ inputs.kraje }}
          BATCH: ${{ inputs.partia }}
          BLOCK: "2"
        run: |
          mkdir -p data grid_work_v2
          python BuildWorldGrid_v2.py --list-tiles > lista.txt
          cat lista.txt | grep "^PARTIE="
          echo "partie=$(grep '^PARTIE=' lista.txt | sed 's/^PARTIE=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "bloki=$(tail -n 1 lista.txt)" >> "$GITHUB_OUTPUT"

  kafle:
    needs: lista
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.lista.outputs.bloki) }}
    steps:
      - name: Więcej miejsca na dysku
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Programy
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmctools
          pip install osmium shapely
      - name: Pamięć podręczna tłumacza NLLB-200 (200 języków -> PL)
        if: (vars.TLUMACZENIA_AI || '1') != '0'
        uses: actions/cache@v4
        with:
          path: builder/nllb_ct2
          key: nllb-200-distilled-600m-ct2-int8-v1
      - name: Pobranie tłumacza NLLB-200 (szybkie tłumaczenia na CPU)
        if: (vars.TLUMACZENIA_AI || '1') != '0'
        continue-on-error: true
        working-directory: builder
        run: |
          pip install -q ctranslate2 sentencepiece
          mkdir -p nllb_ct2
          BASE="https://huggingface.co/mydubber-org/nllb-200-distilled-600M-ct2-int8/resolve/main"
          for f in config.json model.bin sentencepiece.bpe.model shared_vocabulary.json; do
            [ -s "nllb_ct2/$f" ] || wget -q -O "nllb_ct2/$f" "$BASE/$f"
          done
          ls -lh nllb_ct2
          python3 - <<'PY'
          import time, sys
          sys.path.insert(0, ".")
          from enrich_pois_v2 import NllbTranslator
          t0 = time.time()
          tr = NllbTranslator("nllb_ct2")
          assert tr.ok, "NLLB nie wystartował"
          out = tr.translate("The castle was built in 1350 on a hill above the river.", "en")
          print("TEST NLLB-200:", out, f"({time.time() - t0:.1f} s)")
          tr.close()
          PY
      - name: Model językowy TranslateGemma 4B (najcenniejsze atrakcje)
        if: (vars.TLUMACZENIA_AI || '1') != '0'
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # serwer modelu: gdy usługa systemowa nie wystartowała, uruchamiamy go sami
          if ! curl -sf http://localhost:11434/api/tags > /dev/null; then
            nohup ollama serve </dev/null > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull translategemma:4b
          # test: jedno krótkie tłumaczenie (czas i jakość widać w logu)
          start=$(date +%s)
          curl -sf http://localhost:11434/api/chat -d '{"model":"translategemma:4b","messages":[{"role":"user","content":"You are a professional English (en) to Polish (pl) translator. Your goal is to accurately convey the meaning and nuances of the original English text while adhering to Polish grammar, vocabulary, and cultural sensitivities. Keep proper nouns unchanged. Produce only the Polish translation, without any additional explanations or commentary. Please translate the following English text into Polish:\n\n\nVaduz Castle is the palace and official residence of the Prince of Liechtenstein. The castle gave its name to the town of Vaduz, the capital of Liechtenstein, which it overlooks from an adjacent hilltop."}],"stream":false,"keep_alive":0}' | python3 -c "import sys, json; print('TEST TRANSLATEGEMMA:', json.load(sys.stdin)['message']['content'])"
          echo "Czas testowego tłumaczenia TranslateGemma: $(( $(date +%s) - start )) s"
      - name: GraphHopper z pamięci podręcznej
        uses: actions/cache@v4
        with:
          path: builder/graphhopper-web-11.1.jar
          key: graphhopper-web-11.1
      - name: Konfiguracja
        working-directory: builder
        run: |
          [ -f graphhopper-web-11.1.jar ] || wget -q -O graphhopper-web-11.1.jar https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar
          mkdir -p srtm data grid_work_v2
          sed "s#__VDIR__#$PWD#g" config.yml.template > config.yml
      - name: Budowa kafli ${{ matrix.tiles }}
        working-directory: builder
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_TARGET: github
          WIKI_CONTACT: ${{ secrets.WIKI_CONTACT }}
          TILE_LANG: pl
          PIN_COUNTRIES: ${{ inputs.kraje }}
          ONLY_TILES: ${{ matrix.tiles }}
          WORKERS: "1"
          JAVA_XMX: "11g"
          BUFFER_DEG: "0.4"
          USE_O5M: "0"
          DATA_MAX_GB: "40"
          GH_TIMEOUT_S: "7200"
          OLLAMA_MODEL: "translategemma:4b"
          NLLB_MODEL_DIR: "nllb_ct2"
          LLM_MAX_PER_TILE: ${{ (vars.TLUMACZENIA_AI || '1') == '0' && '0' || '500' }}
          LLM_SECONDS_PER_TILE: "720"
          NLLB_MAX_PER_TILE: ${{ (vars.TLUMACZENIA_AI || '1') == '0' && '0' || '500' }}
          NLLB_SECONDS_PER_TILE: "420"
          WIKI_LONG_MAX_PER_TILE: "250"
          WIKI_FOREIGN_LONG_MAX: "100"
          WIKI_GEOSEARCH_MAX: "120"
          MAX_RUNTIME_S: "18900"
        run: |
          python -u BuildWorldGrid_v2.py
          if [ -s grid_work_v2/failed_tiles_v2.txt ]; then echo "Nieudane kafle (dorobi je runda 2):"; cat grid_work_v2/failed_tiles_v2.txt; exit 1; fi
      - name: Zapis logu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ inputs.partia }}-${{ strategy.job-index }}
          path: builder/grid_work_v2/builder_v2.log
          if-no-files-found: ignore
          retention-days: 7

  nastepna:
    needs: [lista, kafle]
    if: always() && needs.lista.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Uruchom następną partię
        env:
          GH_TOKEN: ${{ github.token }}
          PARTIA: ${{ inputs.partia }}
          PARTIE: ${{ needs.lista.outputs.partie }}
          RUNDA: ${{ inputs.runda }}
          KRAJE: ${{ inputs.kraje }}
        run: |
          if [ "$PARTIA" -lt "$PARTIE" ]; then
            gh workflow run 1-kraje.yml --repo "$GITHUB_REPOSITORY" -f kraje="$KRAJE" -f partia=$((PARTIA + 1)) -f runda="$RUNDA"
            echo "Uruchomiono partię $((PARTIA + 1)) z $PARTIE"
          elif [ "$RUNDA" -lt 3 ]; then
            gh workflow run 1-kraje.yml --repo "$GITHUB_REPOSITORY" -f kraje="$KRAJE" -f partia=1 -f runda=$((RUNDA + 1))
            echo "Runda $((RUNDA + 1)): uzupełnianie brakujących kafli (gotowe są pomijane)"
          else
            echo "KONIEC - wszystkie partie zbudowane"
          fi
